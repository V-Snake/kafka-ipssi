services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    environment:
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka

  hdfs-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.3.5-java11
    container_name: hdfs-namenode
    environment:
      - CLUSTER_NAME=weather-hdfs
    env_file:
      - ./scripts/hadoop.env
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hdfs_namenode:/hadoop/dfs/name

  hdfs-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.3.5-java11
    container_name: hdfs-datanode
    environment:
      - CLUSTER_NAME=weather-hdfs
      - SERVICE_PRECONDITION=hdfs-namenode:9870
    env_file:
      - ./scripts/hadoop.env
    depends_on:
      - hdfs-namenode
    ports:
      - "9864:9864"
    volumes:
      - hdfs_datanode:/hadoop/dfs/data

volumes:
  kafka_data:
  hdfs_namenode:
  hdfs_datanode: